name: Set up the build
description: Install system libraries, the Rust toolchain and the build cache.

inputs:
  components:
    description: Extra toolchain components, comma-separated (e.g. "rustfmt, clippy").
    default: ""

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          clang libclang-dev pkg-config \
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libvulkan-dev
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
