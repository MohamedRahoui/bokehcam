[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MohamedRahoui/bokehcam"

[workspace.dependencies]
bokehcam-core = { path = "crates/bokehcam-core" }
bokehcam-engine = { path = "crates/bokehcam-engine" }
bokehcam-gpu = { path = "crates/bokehcam-gpu" }
bokehcam-infer = { path = "crates/bokehcam-infer" }
bokehcam-media = { path = "crates/bokehcam-media" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
wgpu = "30"
pollster = "0.4"
ort = { version = "=2.0.0-rc.15", features = ["webgpu"] }
gpui-kit = "0.10"

[workspace.lints.clippy]
# `chunks_exact(N)` reads better than `as_chunks::<N>().0` in pixel loops.
chunks_exact_to_as_chunks = "allow"
# Error types of the model runtime are large; they only travel on cold paths.
result_large_err = "allow"

[profile.dev]
opt-level = 1            # image code is unusable unoptimised

[profile.dev.package."*"]
opt-level = 3            # dependencies (decoders, wgpu) at full speed even in dev

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
